# workflow 이름
name: Deploy Backend

# 실행 조건: testbe 브랜치에 push되면 workflow 실행
on:
  push:
    branches:
      - testbe

# 같은 배포 workflow가 동시에 실행되면 이전 실행을 취소
concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    # Runner 환경: GitHub에서 제공하는 Ubuntu Runner 사용
    runs-on: ubuntu-latest

    steps:
      # 현재 GitHub Repository 소스코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # JDK 21 설치
      # Gradle 테스트나 빌드 확인을 추가할 때 사용할 Java 환경
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      # 테스트 실행
      # 현재 배포는 빠른 배포를 위해 테스트를 생략한다.
      # 테스트를 배포 전에 강제하려면 아래 주석을 해제한다.
      # - name: Run tests
      #   working-directory: backend
      #   run: ./gradlew test --no-daemon

      # Docker Buildx 설정
      # Docker 이미지 빌드 기능 확장
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      # GitHub Secrets에 저장한 Docker Hub access token 사용
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 및 Docker Hub push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/likelion-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/likelion-backend:${{ github.sha }}

      # EC2 서버 접속 후 배포 수행
      # GitHub Actions가 EC2 서버에 SSH로 접속한 뒤 배포 명령어를 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/backend

            # Docker Hub에 업로드된 backend 이미지를 EC2 서버로 pull
            docker compose -f compose.yml pull backend

            # 새 이미지를 기반으로 백엔드 컨테이너 재실행
            # MySQL 컨테이너와 네트워크/볼륨도 compose.yml 기준으로 유지
            docker compose -f compose.yml up -d --remove-orphans

            # 사용하지 않는 이미지 정리
            docker image prune -f
