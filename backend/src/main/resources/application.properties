spring.application.name=backend
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:h2:mem:likelion;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=likelion-backend-jwt-secret-key-for-local-development-please-change
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=1209600000
app.cors.allowed-origin=http://localhost:3000
